ingester:
  source_dir: "C:/path/to/incoming_data"
  target_tree: "C:/path/to/company_tree"
  branches: ["Branch_A", "Branch_B", "Branch_C"]

  # The root folder for all reports (e.g., "All Branches reports")
  report_root: "reports"

  # Specific report folders mapping -> [match strings]
  # =========================================================================
  # REPORT ROUTING RULES (Top-Down Priority)
  # =========================================================================
  # Python evaluates these rules from top to bottom and stops at the FIRST match.
  # CRITICAL: Always place the MOST SPECIFIC match strings at the top.
  # If a broad rule is placed above a specific rule, the broad rule will
  # incorrectly capture files meant for the specific folder.
  report_types:
    # 1. HIGHEST PRIORITY (Highly specific strings)
    # This will immediately capture files like "Report_5.7.1_Weekly.zip".
    # Because it is at the top, it prevents the general "5.7.1" rule below from stealing it.
    "Sales Weekly": ["5.7.1 Weekly", "5.7.1_Weekly"]

    # 2. MEDIUM PRIORITY (Broad catch-all strings)
    # This will catch all remaining "5.7.1" files that did NOT match the specific rule above.
    # Note: Always include both Cyrillic and Latin variations if human error is possible.
    "Sales Daily": ["5.7.1", "Sales_daily"]

    # 3. OTHER DISTINCT REPORTS (No overlap risk)
    # These strings do not overlap with the ones above, so their exact order matters less.
    "headcount_summary": ["HC", "headcount", "head_summary"]

  year: "2026"
  log_file: "ingester.log"

# =========================================================================
# GENERATOR PIPELINE RULES
# =========================================================================
# The Generator orchestrates the creation of new reporting periods.
# Flow:
# 1. Creates a new date folder for the specified report type.
# 2. Copies historical files from the previous reporting period.
# 3. Injects externally updated files from the 'external_inputs_dir'.
# 4. Updates the date and refreshes data links inside 'constants_file'
#    and specific target files using xlwings.
generator:
  log_file: "generator.log"
  target_date: "current"
  target_tree: "C:/path/to/company_tree"
  hq_branch: "HQ_51"
  reports_group: "reports"
  external_inputs_dir: "external_inputs"
  # =========================================================================
  # REPORT GENERATION & SCHEDULING RULES
  # =========================================================================
  # The 'schedule' block defines the exact temporal logic for the generator.
  # Valid frequencies: "daily", "weekly", "monthly", "quarterly", "exact_dates"
  report_types:
    "Sales daily":
      schedule:
        frequency: "daily"
      external_files_to_copy: ["CRM_report.xlsx"]
      target_files_to_update: ["5.7.1_Sales_daily.xlsx"]

    "Sales weekly":
      schedule:
        frequency: "weekly"
        days_of_week: ["Monday", "Thursday"] # Can accept multiple days
      external_files_to_copy: ["CRM_report_weekly.xlsx"]
      target_files_to_update: ["5.7.1_Sales_weekly.xlsx"]

      
    "Performance weekly":
     schedule:
       frequency: "weekly"
       days_of_week: ["Friday"] # Can accept multiple days
 
     # ARCHITECTURE NOTE: 'update_sequence' vs 'target_files_to_update'
     # If a report only has simple, independent files to update, use 'target_files_to_update'.
     # If files depend on each other (e.g., File B needs File A to calculate first),
     # use 'update_sequence' to define strict priority tiers. 
     # Note: If 'update_sequence' is present, 'target_files_to_update' is completely ignored.
     update_sequence:
       - # Priority 2
         - "Addendum 1.xlsx"
         - "Addendum 2.xlsx"
         - "Addendum 2.1.xlsx"
         - "Addendum 3.xlsx"
       - # Priority 3 
         - "Report 5.7.1"
         - "Performance Row Report"
       - # Priority 4 (Final Targets)
         - "Final Perf Rep.xlsx"
         - "Perf charts.xlsx"

     # Static external files (No COM touch required)
     external_files_to_copy:
       - "ga.xlsx"
       - "CRM_report_weekly.xlsx"
       - "5.7.1_Sales_weekly.xlsx"

     # Dynamic Fallback Routing
     special_files:
       - target_path: "accounts/accounts.xlsx"
         fallback_group: "reports"     
         fallback_report: "Sales daily"
         fallback_file: "5.7.1_Sales_daily.xlsx"    
         date_rule: "first_of_month"


    "Headcount summary":
      schedule:
        frequency: "monthly"
        days_of_month: [1, 15] # Runs on the 1st and 15th of the month
      external_files_to_copy: ["../HR/headcount.xlsx"]
      target_files_to_update: ["Headcount_monthly.xlsx"]

    "Board report":
      schedule:
        frequency: "exact_dates"
        dates: ["24.07.2026", "14.11.2026"] # Hardcoded target dates
      target_files_to_update: ["Board.xlsx"]

# Excel Manipulation Rules
  show_excel: true
  constants_file: "constants.xlsx"
  constants_sheet: "Constants"   # The exact name of the tab
  constants_date_cell: "$A$2"         # The exact cell reference

# =========================================================================
# AGGREGATOR PIPELINE RULES (MVP)
# =========================================================================
aggregator:
  log_file: "aggregator.log"
  target_date: "current"
  target_tree: "C:/path/to/company_tree" # We will unify this later!
  
  # Structural logic
  branches: ["Branch_A", "Branch_B", "Branch_C"]
  total_node: "total" # Or whatever your 'Total Company' folder is called
  reports_group: "reports"
  show_excel: true

  report_types:
    "Sales daily":
      target_files_to_update: ["5.7.1_Sales_daily.xlsx"]

    "Sales weekly":
      target_files_to_update: ["5.7.1_Sales_weekly.xlsx"]
